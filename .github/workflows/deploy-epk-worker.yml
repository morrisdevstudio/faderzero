name: Deploy EPK Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/epk-public/**'
      - 'scripts/run-cloudflare-checks.mjs'
      - 'scripts/validate-cloudflare-free-tier.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:cloudflare:costs
      - run: npm run typecheck:epk
      - run: npm run test:epk
      - run: npx wrangler@4.118.0 types --check --config cloudflare/epk-public/wrangler.jsonc cloudflare/epk-public/worker-configuration.d.ts
      - name: Validate Cloudflare deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler@4.118.0 deploy --config cloudflare/epk-public/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
