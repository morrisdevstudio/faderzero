<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démos - Logo FADER ZERO</title>
    <!-- Importation de quelques polices Google pour les variations -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800;900&family=Oswald:wght@500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --header-bg: #000000;
            --text-color: #ffffff;
            
            /* Variables pour le splash screen */
            --bg: #000;
            --fg: #fff;
            --duration: 4s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            gap: 60px; /* Espace entre chaque démo */
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0;
            text-align: center;
            font-weight: 500;
            color: #a1a1aa;
        }

        /* --- CONTENEUR SIMULANT UN ECRAN MOBILE --- */
        .mobile-simulator {
            width: 100%;
            max-width: 400px;
            background-color: var(--header-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #333;
            position: relative; /* Pour positionner des éléments absolus à l'intérieur si besoin */
        }

        .demo-title {
            padding: 12px 16px;
            background: #2a2a32;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #111;
            text-align: center;
        }

        /* --- LE HEADER DE L'APP --- */
        .app-header {
            display: flex;
            align-items: center;
            height: 64px;
            padding: 0 16px;
            justify-content: space-between; 
        }

        /* Icones factices */
        .mock-icon {
            width: 24px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            opacity: 0.7;
            cursor: pointer;
        }
        .mock-icon span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: white;
            border-radius: 2px;
        }
        .mock-icon.profile {
            border: 2px solid white;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }

        /* --- LE GROUPE LOGO COMPLET (Icône + Texte) --- */
        .brand-group {
            display: flex;
            align-items: center;
            margin-left: 16px;
            margin-right: auto;
            cursor: pointer;
            gap: 8px; /* Espace réduit pour bien coller l'icône au texte */
        }

        /* --- L'ICÔNE FADER (SVG) --- */
        .fader-icon {
            height: 40px; /* Hauteur globale de l'icône, ajustable */
            display: flex;
            align-items: center;
        }
        
        .fader-icon svg {
            height: 100%;
            width: 10px; /* Force la largeur proportionnelle pour éviter l'étirement (20x80 -> 10x40) */
            stroke: none; /* Plus de trait */
            fill: #ffffff; /* Remplissage avec la couleur définie */
        }

        /* --- LE TEXTE DU LOGO --- */
        .logo-text-container {
            display: flex;
            flex-direction: column;
            width: 90px; 
            justify-content: center;
        }

        .logo-word {
            display: flex;
            justify-content: space-between; 
            width: 100%;
            line-height: 1.1;
        }

        /* Variations du texte conservées */
        .logo-v5 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
        .logo-v5 .word-fader { color: #ffffff; }
        .logo-v5 .word-zero { color: #ffffff; }

        /* --- LOGO RÉDUIT (F Z) --- */
        .logo-reduced-wrapper {
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        .logo-reduced {
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* Force le centrage absolu de l'élément du milieu */
            align-items: center;
            width: 180px; /* Fixe la largeur pour faire un carré parfait */
            height: 180px; /* Fixe la hauteur pour faire un carré parfait */
            background-color: var(--header-bg); 
            border: 1px solid #ffffff; 
            border-radius: 40px; /* Coins arrondis style icône d'application (squircle) */
            box-sizing: border-box; /* Assure que les bordures n'affectent pas la taille du carré */
        }

        .logo-reduced .letter {
            font-family: 'Inter', sans-serif;
            font-weight: 900; /* Extra gras */
            font-size: 80px;
            color: #ffffff;
            line-height: 0.8;
        }

        /* Aligne le F à droite (vers le centre) */
        .logo-reduced .letter:first-child {
            justify-self: end;
            margin-right: 10px;
        }

        /* Aligne le Z à gauche (vers le centre) */
        .logo-reduced .letter:last-child {
            justify-self: start;
            margin-left: 10px;
        }

        .logo-reduced .fader-icon-large {
            height: 90px; /* Plus grand que le texte pour correspondre au croquis */
            display: flex;
            align-items: center;
            justify-self: center; /* Assure que le fader est parfaitement au milieu */
        }

        .logo-reduced .fader-icon-large svg {
            height: 100%;
            width: 20px;
            fill: #ffffff; /* Maintien du fader plein de l'option 5 */
        }
        
        /* =========================================
           STYLES POUR LE SPLASH SCREEN (LOADER PRO)
           ========================================= */
        
        .splash-screen-container {
            /* Ratio exact d'un iPhone (1200x2600) */
            aspect-ratio: 1200 / 2600;
            height: auto; /* Laisse l'aspect-ratio gérer la hauteur selon la largeur */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg); /* Fond très sombre spécifique au loader */
            
            /* Bords arrondis massifs d'un iPhone et faux châssis (border) */
            border-radius: 44px;
            border: 8px solid #1a1a1a;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        /* Le titre de l'app sur une seule ligne (comme sur le croquis) */
        .splash-title {
            font-family: 'Inter', sans-serif;
            font-weight: 500; /* Un peu moins gras que dans le header, comme sur l'image */
            font-size: 32px;
            color: var(--fg);
            letter-spacing: 2px;
            margin-bottom: 40px; /* Espace entre le titre et l'animation */
            z-index: 10; /* S'assure qu'il est au-dessus du loader si besoin */
        }

        /* Styles spécifiques au Fader Loader Pro */
        .loader {
            width: min(220px, 56vw);
            aspect-ratio: 3 / 8;
            color: var(--fg);
        }

        .loader svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .fader-cap {
            transform-box: fill-box;
            transform-origin: center;
            animation: faderMove var(--duration) cubic-bezier(.45, 0, .15, 1) infinite;
            will-change: transform, opacity;
        }

        .pulse {
            animation: pulse var(--duration) ease-in-out infinite;
        }

        @keyframes faderMove {
            0% { transform: translateY(410px); opacity: 1; }
            76% { transform: translateY(49px); opacity: 1; }
            87% { transform: translateY(49px); opacity: 1; }
            93% { transform: translateY(49px); opacity: 0; }
            93.01% { transform: translateY(410px); opacity: 0; }
            100% { transform: translateY(410px); opacity: 1; }
        }

        @keyframes pulse {
            0%, 76%, 100% { opacity: .25; }
            84% { opacity: .9; }
        }

        @media (prefers-reduced-motion: reduce) {
            .fader-cap, .pulse {
                animation-duration: 15s;
            }
        }

    </style>
</head>
<body>

    <h1>Récapitulatif - Logo "FADER ZERO"</h1>

    <!-- Définition du SVG de l'icône Fader réutilisable (pour header et icône carrée) -->
    <svg style="display: none;">
        <symbol id="fader-svg-icon" viewBox="0 0 20 80">
            <!-- La longue ligne verticale (la piste) -->
            <rect x="9" y="0" width="2" height="80" rx="0.5" />
            <!-- Le bouton du fader (capuchon) -->
            <rect x="2" y="20" width="16" height="24" rx="2" />
        </symbol>
    </svg>

    <!-- SECTION 1 : Le Header (Style 5) -->
    <div class="mobile-simulator">
        <div class="demo-title">Header App (Style Impact)</div>
        <div class="app-header">
            <div class="mock-icon"><span></span><span></span><span></span></div>
            
            <div class="brand-group style-v5">
                <div class="fader-icon">
                    <svg><use href="#fader-svg-icon"></use></svg>
                </div>
                <div class="logo-text-container logo-v5">
                    <div class="logo-word word-fader">
                        <span>F</span><span>A</span><span>D</span><span>E</span><span>R</span>
                    </div>
                    <div class="logo-word word-zero">
                        <span>Z</span><span>E</span><span>R</span><span>O</span>
                    </div>
                </div>
            </div>

            <div class="mock-icon profile"></div>
        </div>
    </div>

    <!-- SECTION 2 : L'Icône d'Application Carrée -->
    <div class="mobile-simulator" style="background: transparent; border: none; box-shadow: none;">
        <div class="demo-title" style="text-align: center; border: none; background: transparent; padding-top: 0;">Icône d'Application Carrée</div>
        <div class="logo-reduced-wrapper">
            <div class="logo-reduced">
                <span class="letter">F</span>
                <div class="fader-icon-large">
                    <!-- On réutilise notre SVG défini en haut du fichier -->
                    <svg><use href="#fader-svg-icon"></use></svg>
                </div>
                <span class="letter">Z</span>
            </div>
        </div>
    </div>
    
    <!-- SECTION 3 : Le Splash Screen avec Fader Loader Pro -->
    <div class="mobile-simulator splash-screen-container">
        <div class="demo-title" style="position: absolute; top: 0; width: 100%; box-sizing: border-box;">Splash Screen Animé</div>
        
        <!-- Le titre sur une seule ligne (ajusté selon l'image) -->
        <div class="splash-title">
            FADERZERO
        </div>
        
        <!-- Intégration du code SVG Pro -->
        <div class="loader" role="progressbar" aria-label="Chargement" aria-valuemin="0" aria-valuemax="100">
            <svg viewBox="0 0 240 640" aria-hidden="true">
                <defs>
                    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
            
                    <linearGradient id="capFill" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#171717" />
                        <stop offset="48%" stop-color="#050505" />
                        <stop offset="100%" stop-color="#141414" />
                    </linearGradient>
            
                    <linearGradient id="capEdge" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#fff" stop-opacity=".45" />
                        <stop offset="15%" stop-color="#fff" stop-opacity="1" />
                        <stop offset="85%" stop-color="#fff" stop-opacity="1" />
                        <stop offset="100%" stop-color="#fff" stop-opacity=".45" />
                    </linearGradient>
                </defs>
            
                <g fill="none" stroke="currentColor" stroke-linecap="round">
                    <!-- Rail extérieur -->
                    <rect
                        x="114"
                        y="68"
                        width="12"
                        height="500"
                        rx="6"
                        stroke-width="1.5"
                        opacity=".75"
                    />
            
                    <!-- Fente intérieure -->
                    <rect
                        x="118"
                        y="74"
                        width="4"
                        height="488"
                        rx="2"
                        fill="currentColor"
                        opacity=".16"
                        stroke="none"
                    />
            
                    <!-- Marque de position 0 -->
                    <g opacity=".6">
                        <line x1="55" y1="193" x2="75" y2="193" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <text x="45" y="199" fill="currentColor" font-family="'Inter', sans-serif" font-weight="600" font-size="18" text-anchor="end" stroke="none">0</text>
                    </g>
                </g>
            
                <!-- Fader animé -->
                <g class="fader-cap">
                    <!-- Ombre -->
                    <rect
                        x="80.8"
                        y="84"
                        width="78.4"
                        height="128"
                        rx="12"
                        fill="#fff"
                        opacity=".08"
                        filter="url(#softGlow)"
                    />
            
                    <!-- Corps -->
                    <rect
                        x="84.8"
                        y="80"
                        width="70.4"
                        height="128"
                        rx="11"
                        fill="url(#capFill)"
                        stroke="url(#capEdge)"
                        stroke-width="2"
                    />
            
                    <!-- Biseaux -->
                    <path
                        d="M92 200 H148"
                        stroke="currentColor"
                        stroke-width="1.2"
                        opacity=".28"
                    />
            
                    <!-- Rainures -->
                    <g stroke="currentColor" stroke-linecap="round">
                        <line x1="92" y1="105" x2="148" y2="105" stroke-width="2" opacity=".72" />
                        <line x1="92" y1="118" x2="148" y2="118" stroke-width="2" opacity=".8" />
                        <line x1="92" y1="131" x2="148" y2="131" stroke-width="2" opacity=".9" />
                        <line x1="92" y1="144" x2="148" y2="144" stroke-width="3.2" />
                        <line x1="92" y1="157" x2="148" y2="157" stroke-width="2" opacity=".9" />
                        <line x1="92" y1="170" x2="148" y2="170" stroke-width="2" opacity=".8" />
                        <line x1="92" y1="183" x2="148" y2="183" stroke-width="2" opacity=".72" />
                    </g>
            
                    <!-- Repère central -->
                    <rect
                        x="84.8"
                        y="141"
                        width="70.4"
                        height="6"
                        fill="currentColor"
                    />
            
                    <line
                        x1="91"
                        y1="144"
                        x2="149"
                        y2="144"
                        stroke="#000"
                        stroke-width="1.5"
                        opacity=".65"
                    />
                </g>
            </svg>
        </div>
        
    </div>

</body>
</html>
